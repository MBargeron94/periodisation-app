<title>Rifle Season Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a coach's wall chart. Year timeline on top (one column per week), the selected 4-week block under it, calendar and rules below. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --sunken:#e9eef2; --fg:#16212b; --muted:#566676; --line:#d5dde4;
  --accent:#0d5c8a; --accent-fg:#ffffff; --warn:#a85b00; --warn-bg:#fff3de; --info-bg:#e6f1f8;
  --pp1:#2f8f6f; --pp2:#2a63b8; --comp:#c5352c; --rec:#c79a12; --arec:#dcbf5e; --hol:#7f8c9b;
  --c10:#7b4fc0; --c50:#1c7fa8; --cphys:#2f8a4f; --cment:#b4468c; --crec:#b08512;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#172029; --sunken:#1f2a35; --fg:#e7edf2; --muted:#96a6b5; --line:#2b3845;
  --accent:#62b4e8; --accent-fg:#08202f; --warn:#f0b35a; --warn-bg:#3a2b12; --info-bg:#16303f;
  --pp1:#46b08c; --pp2:#5b8fe0; --comp:#e8584e; --rec:#d9ae2e; --arec:#a8924a; --hol:#6b7a8b;
  --c10:#a583e6; --c50:#4fb0d6; --cphys:#58b878; --cment:#d877b4; --crec:#d4aa3a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#172029; --sunken:#1f2a35; --fg:#e7edf2; --muted:#96a6b5; --line:#2b3845;
  --accent:#62b4e8; --accent-fg:#08202f; --warn:#f0b35a; --warn-bg:#3a2b12; --info-bg:#16303f;
  --pp1:#46b08c; --pp2:#5b8fe0; --comp:#e8584e; --rec:#d9ae2e; --arec:#a8924a; --hol:#6b7a8b;
  --c10:#a583e6; --c50:#4fb0d6; --cphys:#58b878; --cment:#d877b4; --crec:#d4aa3a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px;font-weight:700} h2{font-size:19px;font-weight:600} h3{font-size:15px;font-weight:600}
.lab{font-family:var(--display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.panel>.hd{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0;max-width:100%}
input[type=number]{width:76px}
button{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button.danger{color:var(--comp)}
button.link{border:0;background:none;padding:2px 4px;color:var(--accent);text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#save{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--fg);border:1px solid var(--warn);border-radius:6px;padding:8px 12px}
/* timeline */
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.tl-in{position:relative;cursor:pointer}
.tr{display:flex;border-bottom:1px solid var(--line)}
.tr:last-child{border-bottom:0}
.tl-l{position:sticky;left:0;z-index:3;flex:none;background:var(--surface);border-right:1px solid var(--line);
  padding:0 8px;display:flex;align-items:center;font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.tl-t{position:relative;flex:none}
.tl-t>*{position:absolute}
.mon{top:0;height:100%;border-left:1px solid var(--line);padding:2px 0 0 4px;font-size:11px;font-weight:600;white-space:nowrap}
.wk{top:0;height:100%;text-align:center;font-size:9px;color:var(--muted);line-height:16px}
.wk.gridl{border-left:1px solid var(--line);opacity:.6}
.ph{top:3px;height:20px;border-radius:3px;color:#fff;font-family:var(--display);font-size:11px;font-weight:600;line-height:20px;text-align:center;overflow:hidden;white-space:nowrap}
.ph.REC,.ph.AREC{color:#2b2206}
.ev{height:15px;border-radius:3px;display:flex;align-items:center}
.ev i{display:block;height:100%;border-radius:3px;flex:none;border:2px solid var(--fg);font-style:normal;font-size:10px;line-height:11px;text-align:center}
.ev.peak i{background:var(--comp);border-color:var(--comp);color:#fff}
.ev.major i{background:var(--fg);}
.ev.small i{background:transparent}
.ev.hol i{background:var(--arec);border-color:var(--rec)}
.ev.camp i{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px);border-color:var(--muted)}
.ev span{font-size:10.5px;white-space:nowrap;padding-left:4px;font-weight:500}
.ev.peak span{font-weight:700}
.heat{top:2px;height:14px;border-radius:2px;font-size:9.5px;line-height:14px;text-align:center;color:var(--fg);overflow:hidden;white-space:nowrap}
.wd{top:0;height:100%;padding-top:3px;font-size:10px;line-height:1.3;text-align:center;overflow:hidden;white-space:nowrap;border-left:1px solid var(--line)}
.wd b{font-family:var(--display);font-weight:600;letter-spacing:.02em}
.seg{display:flex}
.seg button{border-radius:0;padding:4px 10px;font-size:12.5px}
.seg button+button{border-left:0}
.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.sel{position:absolute;top:0;bottom:0;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);z-index:2;pointer-events:none;border-radius:3px}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--fg);z-index:2;pointer-events:none;opacity:.55}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.sw-PP1{background:var(--pp1)}.sw-PP2{background:var(--pp2)}.sw-COMP{background:var(--comp)}.sw-REC{background:var(--rec)}.sw-AREC{background:var(--arec)}.sw-HOL{background:var(--hol)}
/* flags */
.flags{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.flags li{padding:7px 10px;border-radius:4px;border-left:4px solid var(--accent);background:var(--info-bg)}
.flags li.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.flags .tag{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
/* block */
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.wkc{border:1px solid var(--line);border-top:4px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface)}
.wkc.PP1{border-top-color:var(--pp1)}.wkc.PP2{border-top-color:var(--pp2)}.wkc.COMP{border-top-color:var(--comp)}.wkc.REC{border-top-color:var(--rec)}.wkc.AREC{border-top-color:var(--arec)}.wkc.HOL{border-top-color:var(--hol)}
.pill{display:inline-block;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:10px;border:1px solid var(--line);background:var(--sunken)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{background:var(--sunken);border-radius:4px;padding:5px 7px}
.stats b{display:block;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1}
.bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--sunken)}
.split{display:grid;grid-template-columns:1fr auto;gap:1px 10px;font-size:12.5px}
.split i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.wkc ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.evl{font-size:12.5px;display:flex;flex-direction:column;gap:2px}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.act{white-space:nowrap;text-align:right}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
details>summary{cursor:pointer;font-family:var(--display);font-size:17px;font-weight:600}
details[open]>summary{margin-bottom:10px}
.prose{max-width:70ch} .prose p{margin:0 0 8px} .prose ul{margin:0 0 8px;padding-left:18px}
.ev.major i{color:var(--surface);font-weight:700}
.ev.key i{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:700}
.ev.key span{font-weight:600}
.chip.key{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:600}
.gl{top:25px;height:16px;line-height:16px;text-align:center;font-size:11px;font-weight:700;color:var(--fg)}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk.man{color:var(--accent-fg);background:var(--accent);opacity:1;border-radius:2px;font-weight:700}
.shots{font-size:12.5px;background:var(--sunken);border-radius:4px;padding:6px 8px}
.shots b{font-size:14px}
details.adj>summary{font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--accent)}
details.adj[open]>summary{margin-bottom:6px}
details.adj input[type=number]{width:70px}
textarea{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
textarea{width:100%;resize:vertical}
.rstat{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.rstat b{font-family:var(--display);font-size:18px}
.pill.rate-ok{border-color:var(--pp1);color:var(--pp1)}.pill.rate-stretch{border-color:var(--warn);color:var(--warn)}.pill.rate-bad{border-color:var(--comp);color:var(--comp)}
table.bg td{vertical-align:top}
.bgoal{background:var(--info-bg);border-left:4px solid var(--accent);border-radius:4px;padding:8px 11px;margin-bottom:10px;max-width:110ch;display:flex;flex-direction:column;gap:2px}
.feedp{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.goalc{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.goalc.main{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.gstats>div{background:var(--sunken);border-radius:4px;padding:7px 9px;font-size:12px;min-width:0}
.gstats b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.15}
table.path td{vertical-align:top}
table.path tr.tgt td{background:var(--info-bg)}
.mpath{font-size:12.5px;margin:0 0 6px;padding:5px 8px;background:var(--info-bg);border-radius:4px}
.sugg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sugg li{padding:9px 11px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;max-width:110ch}
.sugg li.strong{border-left-color:var(--comp)}
.sugg li.good{border-left-color:var(--pp1)}
.sugg button{font-size:12.5px;padding:4px 9px}
details.why{margin-top:5px}
details.why>summary{font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--accent)}
details.why[open]>summary{margin-bottom:5px}
details.why ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:95ch}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,620px),1fr));gap:18px 16px}
.mon-b{min-width:0}.mon-b h3{margin-bottom:5px}
.mscroll{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
.mgrid{min-width:600px}
.mhead,.mrow{display:grid;grid-template-columns:104px repeat(7,minmax(0,1fr))}
.mhead div{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:3px 5px}
.mrow{border-top:1px solid var(--line);background:color-mix(in srgb,var(--pc,transparent) 10%,transparent);cursor:pointer;min-height:66px}
.mrow.off{cursor:default}
.mrow[data-mw]:hover{outline:2px solid var(--accent);outline-offset:-2px}
.wsum{border-left:4px solid var(--pc,var(--line));padding:4px 6px;font-size:11px;line-height:1.35}
.day{border-left:1px solid var(--line);padding:2px 3px 4px;min-width:0;display:flex;flex-direction:column;gap:2px}
.day.out{background:var(--bg);opacity:.55}
.dn{font-size:11px;color:var(--muted);align-self:flex-start;padding:0 4px}
.day.now .dn{background:var(--accent);color:var(--accent-fg);border-radius:8px;font-weight:600}
.chip{font-size:10.5px;line-height:15px;height:17px;border-radius:3px;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--fg)}
.chip.spill{overflow:visible;position:relative;z-index:1;border-radius:3px 0 0 3px;margin-right:-4px}
.chip.cont{border-radius:0;margin:0 -4px;border-left-width:0;position:relative}
.chip.spill{border-right-width:0}
.chip.peak{background:var(--comp);border-color:var(--comp);color:#fff;font-weight:600}
.chip.major{background:var(--fg);color:var(--surface)}
.chip.small{background:var(--surface)}
.chip.camp{background:var(--sunken);border-color:var(--muted)}
.chip.hol{background:var(--arec);border-color:var(--rec);color:#2b2206}
tr.off td{color:var(--muted)}
label.chk{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:6px}
.empty{text-align:center;padding:36px 16px}
.empty p{max-width:52ch;margin:8px auto 14px;color:var(--muted)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="lab">10m air rifle · 50m rifle 3 positions</div>
      <h1>Rifle Season Planner</h1>
    </div>
    <div class="row" id="athbar"></div>
  </header>
  <div id="notice"></div>
  <div id="app"><div class="panel empty"><h2>Loading your athletes…</h2></div></div>
</div>

<script>
"use strict";
/* ================= dates ================= */
/* Parked features: set to true to bring them back. Their code and saved data are kept. */
const FEATURES={goals:false}; /* season goal, block goals and estimated final entry scores (replaced by the rankings-feed goals) */
const DAY=864e5, WEEK=7*DAY;
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return Date.UTC(y,m-1,d)};
const iso=ms=>new Date(ms).toISOString().slice(0,10);
const mondayOf=ms=>ms-((new Date(ms).getUTCDay()+6)%7)*DAY;
const fmt=(ms,o)=>new Date(ms).toLocaleDateString("en-GB",Object.assign({day:"numeric",month:"short",timeZone:"UTC"},o||{}));
const range=(a,b)=>fmt(a)===fmt(b)?fmt(a):fmt(a)+" – "+fmt(b);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r5=v=>Math.round(v/5)*5;

/* ================= defaults ================= */
const PH={PP1:{n:"Preparation 1",s:"PREP 1"},PP2:{n:"Preparation 2",s:"PREP 2"},COMP:{n:"Competition",s:"COMP"},REC:{n:"Recovery",s:"REC"},AREC:{n:"Active recovery",s:"A-REC"},HOL:{n:"Holiday",s:"HOL"}};
const DEF={finals:{pp1:5,pp2:15,pre:25,taper:30},shots:{r10:55,rk:65,rp:75,rs:45,k:35,p:25,s:40},taperPeak:2,majorTaperDays:4,recoveryWeeks:2,clusterGap:4,pp2Max:10,
  split:{PP1:{sport:45,phys:35,mental:10,rec:10},PP2:{sport:60,phys:20,mental:12,rec:8},COMP:{sport:55,phys:12,mental:18,rec:15},REC:{sport:0,phys:30,mental:10,rec:60},AREC:{sport:20,phys:40,mental:10,rec:30}}};
const settingsOf=a=>{const s=Object.assign({},DEF,a.settings||{});s.split=Object.assign({},DEF.split,(a.settings||{}).split||{});s.shots=Object.assign({},DEF.shots,(a.settings||{}).shots||{});s.finals=Object.assign({},DEF.finals,(a.settings||{}).finals||{});return s};
const PROG={1:[85],2:[80,90],3:[80,90,65],4:[75,85,95,65],5:[70,80,90,95,65]};
const REG={1:[90],2:[100,85],3:[95,100,85],4:[90,100,95,85],5:[85,95,100,95,85]};
const sizes=(n,nb)=>{nb=Math.max(1,nb);const b=Math.floor(n/nb),r=n%nb;return Array.from({length:nb},(_,i)=>b+(i<r?1:0))};

/* ================= periodisation engine ================= */
function plan(a){
  const S=settingsOf(a), N=clamp(parseInt(a.weeks)||52,8,104), hmax=Number(a.hoursMax)||30;
  const s0=mondayOf(parse(a.seasonStart)), wi=ms=>Math.floor((ms-s0)/WEEK), flags=[];
  const W=Array.from({length:N},(_,i)=>({i,start:s0+i*WEEK,phase:"PP1",cyc:null,events:[],tags:[],load:80,inten:4,type:"Build"}));
  const evs=[];
  (a.events||[]).forEach(e=>{
    if(!e.start)return; const st=parse(e.start), en=Math.max(st,parse(e.end||e.start));
    const x=Object.assign({},e,{st,en,w0:wi(st),w1:wi(en)});
    if(x.w1<0||x.w0>=N){flags.push({lv:"info",w:null,t:`${e.name} (${fmt(st,{year:"numeric"})}) is outside this season, so it is not planned for.`});return}
    x.w0=clamp(x.w0,0,N-1);x.w1=clamp(x.w1,0,N-1);evs.push(x);for(let w=x.w0;w<=x.w1;w++)W[w].events.push(x);
  });
  /* a week with 5 or more holiday days is a holiday week: no training, and it does not count as preparation */
  W.forEach(w=>{const d=new Set();w.events.filter(e=>e.type==="hol").forEach(e=>{for(let x=Math.max(e.st,w.start);x<=Math.min(e.en,w.start+6*DAY);x+=DAY)d.add(x)});w.holDays=d.size});
  const isHolW=w=>w.holDays>=5;
  const peaks=evs.filter(e=>e.type==="comp"&&e.tier==="peak").sort((x,y)=>x.w0-y.w0);
  const clusters=[];
  peaks.forEach(p=>{const c=clusters[clusters.length-1];
    if(c&&p.w0-c.end-1<=S.clusterGap){c.peaks.push(p);c.end=Math.max(c.end,p.w1)}else clusters.push({peaks:[p],first:p.w0,end:p.w1})});
  const recPhases=(from,R)=>{const nRec=R>=4?2:1;for(let k=0;k<R&&from+k<N;k++)W[from+k].phase=k<nRec?"REC":"AREC"};
  const prepSplit=n=>n<=8?[0,n]:n<=11?[n-6,6]:[n-Math.min(S.pp2Max,Math.round(n/2)),Math.min(S.pp2Max,Math.round(n/2))];
  let lower=0,prev=null;
  clusters.forEach((c,ci)=>{
    const nm=c.peaks[0].name, wantT=clamp(parseInt(c.peaks[0].taper)||S.taperPeak,1,4);
    const wantR=prev?S.recoveryWeeks+((prev.end-prev.compStart+1)>=5?1:0):0;
    let T=wantT,R=wantR; const avail=c.first-lower;
    if(avail<R+3+T){R=Math.max(prev?1:0,Math.min(R,avail-3-T));if(avail-R-T<2)T=Math.max(1,Math.min(T,avail-R-2));R=clamp(R,0,avail);T=clamp(T,0,avail-R)}
    c.T=T;c.compStart=c.first-T;c.idx=ci;

/* coaching content for a week */
function focus(w,P){
  const out=[],has=t=>w.tags.includes(t);
  if(w.hol>=6)return[`Holiday: no training this week. Proper time away from the range and the gym.`];
  if(w.compDays){const nm=[...new Set(w.events.filter(e=>e.type==="comp").map(e=>e.name))].join(", ");
    if(w.load===0&&!w.manual)return[`Competition: ${nm}. Nothing is planned on competition days. The plan covers the build-up before and the recovery after.`];
    out.push(`Competition days: ${w.compDays} (${nm}). Nothing is planned on them; the hours below are for the other days of the week only.`)}
  if(w.hol)out.push(`Holiday: ${w.hol} day${w.hol===1?"":"s"} with no training. Hours are for the remaining days only; do not squeeze the missed sessions into them.`);
  if(has("Ease back in"))out.push("First week back from holiday: rebuild volume across the week. Start with holding and dry firing before full sessions.");
  if(w.phase!=="REC"&&w.phase!=="HOL"){const a=Math.round(w.share10*100);
    const nx=w.keyEv||w.keyPrep||w.next;
    out.push(nx?`Range time about ${a}% 10m, ${100-a}% 50m. ${nx.w0>w.i?(nx.w0-w.i)+" week"+(nx.w0-w.i===1?"":"s")+" to "+nx.name:nx.name+" this week"}.`:`Range time about ${a}% 10m, ${100-a}% 50m.`)}
  const T={
    "Deload":"Deload: cut volume by about a third, keep session quality and frequency.",
    "Peak load":"Heaviest week of this block. Scores may dip; judge it on process, not results.",
    "Overreach":"Planned overreach: highest load of the year's build. Sleep and nutrition are part of the session plan.",
    "Step-down":"Step down from the overreach. Volume falls, competition-format work stays.",
    "Taper":"Taper: volume down, intensity and number of sessions held. Short sessions, full concentration.",
    "Maintain":"Between peaks: one or two normal-volume days to top up, then taper again.",
    "Camp load":"Camp replaces the deload. Plan light days straight after.",
    "Key taper":"Taper for the key event: volume down, intensity and number of sessions held. Short sessions, full concentration.",
    "Key competition":"Key event this week: the full competition routine. Plan two or three easy days after it.",
    "Hold form":"Holding form from the previous season before the key event: normal sessions at moderate volume, competition-format work, and no big technical changes.",
    "Easy week":"Easy week after the key event: two or three days off the range, then light sessions. The build picks up again next week."};
  if(T[w.type])out.push(T[w.type]);
  if(has("Quota event"))out.push("Quota event: treated close to a peak. Volume well down, full competition routine, no experiments with technique or equipment.");
  if(has("Quota taper"))out.push("Taper week for the quota event: volume down about a fifth, intensity up, match and finals rehearsals.");
  if(has("Easy days first"))out.push("Start the week with one or two easy days after the quota event, then return to the block.");
  const FT={pp1:"Finals: familiarity work. Commands, timings and single-shot rhythm, with no weight on scores.",
    pp2:"Finals: full finals with announcements, eliminations and noise. They take attention off qualification scores and build resilience.",
    pre:"Finals: a main emphasis of range time this week. Full finals under pressure, including starting from behind and shoot-offs.",
    taper:"Finals: short, sharp finals at competition intensity. Rehearse the walk-in, the presentation and the first shots."};
  if(w.finKind&&w.split.fin>=.25)out.push(FT[w.finKind]);
  if(w.manual)out.push("This week has been adjusted by hand, so its figures differ from the automatic plan.");
  if(has("Mini-taper"))out.push(`Mini-taper: reduce volume for the ${P.S.majorTaperDays} days before the major competition and run the full peak-event routine.`);
  if(has("Train through"))out.push("Minor competition: train through it. Use it as a competition simulation with process goals only.");
  if(has("Rehearsal"))out.push("Major competition as final rehearsal: same warm-up, timings and match plan as the peak event.");
  if(has("Camp")&&w.type!=="Camp load")out.push(w.phase==="COMP"?"Pre-competition camp: taper volume, match rehearsals, finals practice.":"Training camp: use the extra range time for the block's technical priorities.");
  const F={
    PP1:["Technique: isolated elements. Dry firing, holding, position rebuilds for kneeling, prone and standing taken one at a time.","Physical: main strength and aerobic gains of the cycle. Stabilisers and trunk first.","Mental: relaxation training, goal setting, motivation.","Equipment and ammunition tests, performance tests and a SCATT baseline belong here."],
    PP2:["Technique: rhythm and flow. Full 3-position courses with changeovers and sighter timing; full 60-shot air rifle matches.","Physical: maintain, small gains only.","Mental: concentration, stop techniques, visualisation; write and rehearse the match script.","Tactics: time management, if-then rules, wind and light reading at 50m. Lock equipment choices; nothing new after this phase."],
    COMP:["Short, technically intense sessions. Competition simulations, finals, competition warm-ups.","Physical: light aerobic work as active recovery only.","Mental: competition visualisation, routines, regular sleep and food.","No new equipment or technique changes."],
    REC:["No range access. Holiday, leisure, wellness.","Leave the competition analysis until emotions have settled."],
    HOL:["Holiday: no range or gym sessions are planned."],
    AREC:["Fun recreational sport and light extensive training.","Complete the competition analysis (body, technique, tactics, mental, environment) and set goals for the next cycle."]};
  return out.concat(F[w.phase]);
}

function methodHtml(){return `<section class="panel"><details><summary>How the plan is built</summary><div class="prose">
  <p>The season is planned backwards from the peak events, following the Swiss Shooting / J+S training-planning course and the wider periodisation literature.</p>
  <ul>
   <li><strong>Phases.</strong> Each peak (or group of peaks close together) gets its own cycle: Preparation 1 (general: fitness, technique elements, equipment tests), Preparation 2 (specific: rhythm, full courses, match script), Competition (taper plus the event), then Recovery and Active recovery. Two peaks months apart give the double periodisation typical of an indoor 10m and outdoor 50m year.</li>
   <li><strong>4-week blocks.</strong> Preparation blocks load progressively and end with a deload week (3:1). The last block before a peak is regressive: an overreach week early, then stepping down into the taper.</li>
   <li><strong>Taper.</strong> Default 2 weeks, with volume falling to roughly half while intensity and session frequency are held. This matches the taper meta-analysis by Bosquet et al. (2007) and Mujika and Padilla (2003). The planner shortens the taper or the recovery itself when events are too close and tells you when it has.</li>
   <li><strong>Priorities.</strong> Peak events shape the phases. Key events sit between major and peak: the 3 weeks before become specific preparation with a one-week taper, the week after is an easy week, and the plan then returns to the build for the next peak without a recovery block. A key event within four weeks of the season start is prepared by holding form from the previous season. A key event that runs into a peak's taper, a recovery period or another key event is planned as a major and flagged. Major events get a mini-taper of a few days inside the build. Minor events are trained through and used as competition simulations.</li>
   <li><strong>Quota and selection events.</strong> A major event marked as quota gets a one-week taper before it, a deeper cut in volume during it, and easy days after. It does not move the phases; if the whole build should point at it, make it a peak.</li>
   <li><strong>Suggested shots.</strong> Range hours are converted to live shots with the hourly rates under Planning rules, which include breaks: one rate for air rifle and one each for kneeling, prone and standing. 50m range time is divided between the three positions by the percentages there, so a position with a faster rate gives more shots for the same time. Preparation 1 counts 20% fewer live shots because more of the range time is dry firing and holding. These are starting values to test against what your athletes actually shoot.</li>
   <li><strong>Suggestions.</strong> The planner looks for events that work against the plan and proposes leaving them out or lowering their priority for that athlete: competitions or camps in a recovery period, a major in the heaviest build week or the last week of a taper, a match in the other discipline close to a single-discipline peak, three or more competitions inside four weeks of a build, and peaks too close together. An event with two or more of these problems is called out as really not fitting. Quota events are never suggested for removal. It also points out good places for a marker competition: a lighter week that closes a training block, with no other competition within three weeks either side.</li>
   <li><strong>Finals training.</strong> A share of range time is set aside for finals in every training phase, and it rises in the run-in to a competition: any week with a major, quota or peak event in the next two weeks, and the last build block before a peak. Working on finals in the build-up takes attention off qualification scores while building resilience and familiarity with the format. The shares are under Planning rules.</li>
   <li><strong>Athlete details.</strong> Stronger discipline moves 10% of Preparation 1 range time to the weaker one. Seasons are date windows on the same calendar, so starting a new season keeps the old one viewable with its goals, notes, hand adjustments and results.</li>
   ${FEATURES.goals?`<li><strong>Season goal and block goals.</strong> A goal names a target event, a discipline and an outcome. For "make the final" the target score is the estimated final entry score entered on the competition; for other outcomes you type it. The current level is the average of the last three entered results, or a value you set. The gap is rated against your realistic gain for the season. Block goals step the score from the current level to the target across the 4-week blocks before the event, each measured at a marker competition in that block, with a process goal for the phase.</li>`:""}
   <li><strong>Goals and pathway.</strong> Goals use the Olympic Rifle Rankings feed with the formulas in its README: projected level at the target = level now + trend × 1.5 × (1 − e<sup>−h/1.5</sup>) + the venue's usual difference, where h is the years ahead. The chance of the final is Φ((projected − cut) / √(SD² + cut scatter²)), and the level needed is the cut plus z × the same spread, with z 0, 0.524 or 1.036 for 50, 70 or 85% confidence. Medals use the final chance × the athlete's conversion rate in air rifle and 3P, and the 3rd-best line in prone; the level needed for a medal uses the 3rd-best line. A start date before the feed date uses the level now. Monthly milestones run in a straight line from that level to the needed level less the venue difference, one month before the competition.</li>
   <li><strong>Hand adjustments.</strong> Any week's phase, volume or intensity can be set by hand in its week card. Adjusted weeks stay as you set them when events change, and can be returned to the plan one at a time or all together.</li>
   <li><strong>Competition days.</strong> No training is planned on the days of a competition, whatever its priority. The week's hours shrink in proportion to the days left, and a week that is all competition (or all but one day) has no training hours at all. The plan covers the build-up before each competition and the recovery after it.</li>
   <li><strong>Holidays.</strong> A week with five or more holiday days is a holiday week, shown as its own phase. It has no training and does not count towards the preparation phases: Preparation 1 and 2 are worked out from the training weeks only, so a holiday no longer uses up general preparation. Holiday days carry no training: the week's hours shrink in proportion, a week of five or more days off becomes a holiday week, and the following week is capped so the athlete eases back in. Holidays are flagged when they land in a taper, a competition phase, the last build block before a peak, or on top of a camp or competition. The recovery period after a peak is the best place for them.</li>
   <li><strong>Volume and intensity.</strong> Volume is a percentage of the athlete's heaviest week. Intensity is the course's 1–10 mental-intensity scale (training conditions 1–3, competition 8–10). Weekly load in the course's units is shots multiplied by that intensity.</li>
   <li><strong>10m and 50m share.</strong> Range time leans towards the discipline of the next peak, more strongly as it approaches, and evens out when the peak covers both.</li>
  </ul>
  <p class="muted">The hour splits between range, physical, mental and recovery work are starting values to adjust under Planning rules. Sources: Haidn, Weineck and Haidn-Tschalova (2021); Weineck (2014); Issurin (2010) on block periodisation; Bosquet et al. (2007); Mujika and Padilla (2003).</p></div></details></section>`}

function feedMatches(){if(!st.feed)return[];const C=st.feed.meta.calendar,out=[];
  st.cal.events.forEach(e=>{if(e.type!=="comp"||e.training||e.feedComp||!e.start)return;const s=parse(e.start),en=parse(e.end||e.start),nm=e.name.toLowerCase();
    const c=C.find(c=>parse(c.start)<=en+DAY&&parse(c.end)>=s-DAY&&(c.ranges==="all"||e.disc==="both"||c.ranges===e.disc)&&nm.includes(c.city.toLowerCase().slice(0,4)));if(c)out.push({e,c})});return out}
function bestFeedComp(s,en,disc){if(!st.feed||!s)return"";const a=parse(s),b=parse(en||s),C=st.feed.meta.calendar.filter(c=>parse(c.start)<=b+DAY&&parse(c.end)>=a-DAY&&(c.ranges==="all"||disc==="both"||c.ranges===disc));return C.length?C[0].id:""}
function syncEvForm(){const t=$("ev-type"),ti=$("ev-tier");if(!t)return;const v=t.value,comp=v==="comp",d=$("ev-disc").value;
  $("ev-disc-w").hidden=!(comp||v==="training");$("ev-tier-w").hidden=!comp;$("ev-quota-w").hidden=!comp||ti.value!=="major";if($("ev-fc-w"))$("ev-fc-w").hidden=!comp;$("ev-f10-w").hidden=!FEATURES.goals||!comp||d==="50m";$("ev-f50-w").hidden=!FEATURES.goals||!comp||d==="10m";
  const s0=$("ev-start"),e0=$("ev-end");if(s0&&e0)e0.min=s0.value||""}
document.addEventListener("click",e=>{
  const tl=e.target.closest("#tl");
  if(tl){const r=tl.getBoundingClientRect(),x=e.clientX-r.left-(+tl.dataset.lw),a=cur();if(x>=0&&a){const P=plan(view(a)),w=clamp(Math.floor(x/(+tl.dataset.cw)),0,P.N-1);st.sel=P.W[w].block;render()}return}
  const mw=e.target.closest("[data-mw]");
  if(mw){const P=plan(view(cur()));st.sel=P.W[+mw.dataset.mw].block;st.view="athlete";st.jump=true;render();window.scrollTo(0,0);return}
  const sq=e.target.closest("#sq");
  if(sq&&!e.target.closest("[data-act]")){const r=e.target.closest("[data-sq]");if(r){const x=e.clientX-sq.getBoundingClientRect().left-(+sq.dataset.lw);st.cur=r.dataset.sq;st.view="athlete";lsSet("rsp-cur",st.cur);
    const P=plan(view(cur())),w=Math.floor(x/(+sq.dataset.cw))-(+r.dataset.off);st.sel=x>=0&&w>=0&&w<P.N?P.W[w].block:null;render();window.scrollTo(0,0)}return}
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act,id=b.dataset.id;
  if(act==="view"){st.view=id;render();return}
  if(act==="open-ath"){st.cur=id;st.view="athlete";st.sel=null;lsSet("rsp-cur",id);render();window.scrollTo(0,0);return}
  if(act==="goal-add"){mutate(a=>{const G=sgW(a),pk=plan(view(a)).evs.filter(e=>e.type==="comp"&&e.tier==="peak").sort((x,y)=>x.st-y.st)[0];G.list=(G.list||[]).concat([{id:uid(),ev:pk?pk.id:"",disc:pk&&pk.disc!=="both"?pk.disc:"10m",out:"final",main:!(G.list||[]).length}])});return}
  if(act==="goal-del"){mutate(a=>{const G=sgW(a);G.list=(G.list||[]).filter(g=>g.id!==id)});return}
  if(act==="blk-go"){st.sel=+id;st.jump=true;render();const el=document.querySelector(".weeks");el&&el.scrollIntoView({block:"center"});return}
  if(act==="bg-train"){const a0=cur(),P0=plan(view(a0)),M0=goalModel(a0,P0),L=M0.ladder.find(x=>x.key===id);if(!L)return;
    const day=iso(P0.s0+(L.b.start+L.b.len-1)*WEEK+5*DAY),ev={id:uid(),name:"Training match",type:"comp",start:day,end:day,disc:M0.main.disc,tier:"small",training:true};
    st.cal.events.push(ev);saveCal();mutate(a=>{a.picks=a.picks||{};a.picks[ev.id]={on:true};const G=sgW(a);G.blocks=Object.assign({},G.blocks,{[id]:Object.assign({},(G.blocks||{})[id],{marker:ev.id})})});return}
  if(act==="season-next"){st.sel=null;mutate(a=>{const l=seasonsOf(a),nx=iso(mondayOf(parse(a.seasonStart))+(a.weeks||52)*WEEK),x=l.find(q=>q.start===nx);a.seasons=x?l:l.concat([{start:nx,weeks:52}]);a.seasonStart=nx;a.weeks=x?x.weeks:52});return}
  if(act==="fg-add"){const a0=cur(),L=feedEntries(a0);if(!L.length)return;const x=L.find(y=>y.k!=="PR")||L[0],h=x.fa.headline&&x.E.bench[x.fa.headline.compId]?x.fa.headline.compId:"";
    mutate(a=>{a.fgoals=Object.assign({},a.fgoals);const l=(a.fgoals[a.seasonStart]||[]).slice();l.push({id:uid(),ev:x.key,compId:h,out:"final",conf:70,start:iso(Date.now()),notes:""});a.fgoals[a.seasonStart]=l;if(l.length===1)a.fgMain=l[0].id});return}
  if(act==="fg-del"){mutate(a=>{a.fgoals=Object.assign({},a.fgoals);a.fgoals[a.seasonStart]=(a.fgoals[a.seasonStart]||[]).filter(g=>g.id!==id);if(a.fgMain===id)delete a.fgMain});return}
  if(act==="tr-del"){mutate(a=>{a.training=(a.training||[]).filter(x=>x.id!==id)});return}
  if(act==="fc-link"){feedMatches().forEach(({e,c})=>{e.feedComp=c.id});saveCal();render();return}
  if(act==="sg-on"){mutate(a=>{a.picks=a.picks||{};a.picks[id]=Object.assign({},a.picks[id],{on:true})});return}
  if(act==="sg-skip"){mutate(a=>{a.picks[id]=Object.assign({},a.picks[id],{on:false})});return}
  if(act==="sg-tier"){const v=b.dataset.v,ev=st.cal.events.find(x=>x.id===id);mutate(a=>{const k=a.picks[id];if(ev&&v===ev.tier)delete k.tier;else k.tier=v;if(v!=="peak")delete k.taper});return}
  if(act==="sg-dismiss"){mutate(a=>{a.dismissed=Object.assign({},a.dismissed,{[id]:1})});return}
  if(act==="sg-restore"){mutate(a=>{a.dismissed={}});return}
  if(act==="adj-clear"){mutate(a=>{if(a.adj)delete a.adj[id]});return}
  if(act==="adj-clear-all"){mutate(a=>{a.adj={}});return}
  if(act==="ath-add"){st.adding=true;render()}
  else if(act==="ath-cancel"){st.adding=false;render()}
  else if(act==="ath-create"||act==="ath-dup"){const n=($("ath-new").value||"").trim();if(!n){$("ath-new").focus();return}newAthlete(n,act==="ath-dup"?cur():null)}
  else if(act==="ath-del"){st.confirmDel="ath";render()}
  else if(act==="del-cancel"){st.confirmDel=null;render()}
  else if(act==="ath-del2"){const i=st.cur;delete st.athletes[i];st.cur=Object.keys(st.athletes)[0]||null;st.sel=null;st.confirmDel=null;persist(i);render()}
  else if(act==="blk-prev"){st.sel=Math.max(0,st.sel-1);st.jump=true;render()}
  else if(act==="blk-next"){st.sel++;st.jump=true;render()}
  else if(act==="zoom"){st.zoom=+id;st.jump=true;lsSet("rsp-zoom",id);render()}
  else if(act==="ev-edit"){st.editing=id;st.confirmDel=null;render();syncEvForm();$("ev-name").focus()}
  else if(act==="ev-cancel"){st.editing=null;render();syncEvForm()}
  else if(act==="ev-del"){st.confirmDel=id;render();syncEvForm()}
  else if(act==="ev-del2"){st.confirmDel=null;if(st.editing===id)st.editing=null;st.cal.events=st.cal.events.filter(x=>x.id!==id);saveCal();render()}
  else if(act==="set-reset"){mutate(a=>{a.settings={}});syncEvForm()}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="tr-form"){e.preventDefault();const d=$("tr-date").value,sc=$("tr-score").value.trim(),no=$("tr-note").value.trim();if(!d||(!sc&&!no))return;
    mutate(a=>{a.training=(a.training||[]).concat([{id:uid(),date:d,ev:$("tr-ev").value,score:sc===""?null:+sc,note:no}])});return}
  if(e.target.id!=="ev-form")return;e.preventDefault();
  const name=$("ev-name").value.trim(),start=$("ev-start").value;if(!name||!start)return;
  let end=$("ev-end").value||start;if(parse(end)<parse(start))end=start;
  const tsel=$("ev-type").value,trn=tsel==="training",type=trn?"comp":tsel,was=st.editing,ev={id:was||uid(),name,type,start,end,disc:type!=="comp"?"both":$("ev-disc").value,tier:type!=="comp"?null:$("ev-tier").value};
  if(trn){ev.tier="small";ev.training=true}
  if(type==="comp"&&!trn&&$("ev-fc")&&$("ev-fc").value)ev.feedComp=$("ev-fc").value;
  else if(type==="comp"){if(ev.tier==="major"&&$("ev-quota").checked)ev.quota=true;
    const f1=parseFloat($("ev-f10").value),f2=parseFloat($("ev-f50").value);if(f1>0&&ev.disc!=="50m")ev.fin10=f1;if(f2>0&&ev.disc!=="10m")ev.fin50=f2}
  const i=st.cal.events.findIndex(x=>x.id===was);
  if(i>=0)st.cal.events[i]=ev;
  else{st.cal.events.push(ev);const all=!!($("ev-all")&&$("ev-all").checked);
    Object.keys(st.athletes).forEach(k=>{if(k===st.cur||all){const a=st.athletes[k];a.picks=a.picks||{};a.picks[ev.id]={on:true};persist(k)}})}
  st.editing=null;saveCal();render();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="ath-sel"){if(st.view==="squad")st.view="athlete";st.cur=t.value;st.sel=null;st.editing=null;st.confirmDel=null;lsSet("rsp-cur",st.cur);render();syncEvForm();return}
  if(t.id==="ev-type"||t.id==="ev-tier"||t.id==="ev-disc"){syncEvForm();return}
  if(t.id==="ev-start"||t.id==="ev-end"){const e0=$("ev-end"),s0=$("ev-start");if(t.id==="ev-start"&&t.value&&(!e0.value||e0.value<t.value))e0.value=t.value;
    const fc=$("ev-fc");if(fc&&!fc.value)fc.value=bestFeedComp(s0.value,e0.value,$("ev-disc").value);syncEvForm();return}
  if(t.dataset.pick){const id=t.dataset.pick,on=t.checked;mutate(a=>{a.picks=a.picks||{};a.picks[id]=Object.assign({},a.picks[id],{on})});return}
  if(t.dataset.ptier){const id=t.dataset.ptier,ev=st.cal.events.find(x=>x.id===id),v=t.value;mutate(a=>{const k=a.picks[id];if(ev&&v===ev.tier)delete k.tier;else k.tier=v;if(v!=="peak")delete k.taper});return}
  if(t.dataset.ptaper){const id=t.dataset.ptaper,v=parseInt(t.value);mutate(a=>{const k=a.picks[id];if(v>=1)k.taper=clamp(v,1,4);else delete k.taper});return}
  if(t.dataset.fgmain){const id=t.dataset.fgmain;mutate(a=>{a.fgMain=id});return}
  if(t.dataset.fg){const[id,f]=t.dataset.fg.split("|"),v=t.value;mutate(a=>{a.fgoals=Object.assign({},a.fgoals);a.fgoals[a.seasonStart]=(a.fgoals[a.seasonStart]||[]).map(g=>{if(g.id!==id)return g;const n=Object.assign({},g,{[f]:f==="conf"?+v:v});
      if(f==="ev"){const E=st.feed&&st.feed.events[v];if(E&&!E.bench[n.compId])n.compId=""}return n})});return}
  if(t.dataset.gmain){const id=t.dataset.gmain;mutate(a=>{const G=sgW(a);G.list=(G.list||[]).map(g=>Object.assign({},g,{main:g.id===id}))});return}
  if(t.dataset.g2){const[id,f]=t.dataset.g2.split("|"),v=t.value.trim();mutate(a=>{const G=sgW(a);G.list=(G.list||[]).map(g=>{if(g.id!==id)return g;const n=Object.assign({},g);
      if(f==="target"||f==="cur"){if(v==="")delete n[f];else n[f]=+v}else n[f]=v;
      if(f==="ev"){const e=st.cal.events.find(x=>x.id===v);if(e&&e.disc!=="both")n.disc=e.disc}return n})});return}
  if(t.dataset.gain){const k=t.dataset.gain,v=t.value.trim();mutate(a=>{const G=sgW(a);G.gain=Object.assign({},G.gain);if(v===""||!(+v>0))delete G.gain[k];else G.gain[k]=+v});return}
  if(t.dataset.bg){const[k,f]=t.dataset.bg.split("|"),v=t.value.trim(),a0=cur(),L=goalModel(a0,plan(view(a0))).ladder.find(x=>x.key===k);
    mutate(a=>{const G=sgW(a);G.blocks=Object.assign({},G.blocks);const o=G.blocks[k]=Object.assign({},G.blocks[k]);
      if(f==="proc"){if(!v||(L&&v===L.procAuto))delete o.proc;else o.proc=v}else if(f==="score"){if(v==="")delete o.score;else o.score=+v}else o.marker=v;
      if(!Object.keys(o).length)delete G.blocks[k]});return}

  if(t.dataset.goal){const v=t.value;mutate(a=>{a.goals=Object.assign({},a.goals,{[a.seasonStart]:v})});return}
  if(t.dataset.wn){const k=t.dataset.wn,v=t.value.trim();mutate(a=>{a.weekNotes=Object.assign({},a.weekNotes);if(v)a.weekNotes[k]=v;else delete a.weekNotes[k]});return}
  if(t.dataset.res){const[id,k]=t.dataset.res.split("|"),v=t.value.trim();mutate(a=>{a.results=Object.assign({},a.results);const r=a.results[id]=Object.assign({},a.results[id]);if(v)r[k]=k==="q10"||k==="q50"?+v:v;else delete r[k];if(!Object.keys(r).length)delete a.results[id]});return}
  if(t.dataset.fin){const v=clamp(parseFloat(t.value)||0,0,100);mutate(a=>{a.settings=a.settings||{};a.settings.finals=Object.assign({},a.settings.finals,{[t.dataset.fin]:v})});return}
  if(t.dataset.p){const k=t.dataset.p;let v=t.value;
    if(k==="issfId"){v=v.trim().toUpperCase().replace(/\s+/g,"");mutate(a=>{if(!v){delete a.issfId;return}a.issfId=v;if(genderOf(v)&&!a.birthYear)a.birthYear=+v.slice(10,14)});return}
    if(k==="birthYear"){v=parseInt(v);mutate(a=>{if(v>=1940&&v<=2020)a.birthYear=v;else delete a.birthYear});return}
    if(k==="seasonStart"&&v){mutate(a=>{const old=a.seasonStart;a.seasons=seasonsOf(a).filter(q=>q.start!==old&&q.start!==v);if(a.goals&&a.goals[old]!=null&&a.goals[v]==null){a.goals=Object.assign({},a.goals,{[v]:a.goals[old]});delete a.goals[old]}a.seasonStart=v});st.sel=null;render();return}
    if(k==="name"){v=v.trim();if(!v){render();return}}
    if(k==="seasonStart"&&!v){render();return}
    if(k==="weeks")v=clamp(parseInt(v)||52,8,104);if(k==="hoursMax")v=clamp(parseFloat(v)||30,5,50);
    if(k==="seasonStart"||k==="weeks")st.sel=null;
    mutate(a=>{a[k]=v});syncEvForm();return}
  if(t.dataset.s){const v=clamp(parseInt(t.value)||0,+t.min,+t.max);mutate(a=>{a.settings=a.settings||{};a.settings[t.dataset.s]=v});st.sel=Math.min(st.sel,1e9);syncEvForm();return}
  if(t.dataset.pq){const id=t.dataset.pq,on=t.checked;mutate(a=>{a.picks[id].q=on});return}
  if(t.dataset.sh){const v=clamp(parseFloat(t.value)||0,+t.min,+t.max);mutate(a=>{a.settings=a.settings||{};a.settings.shots=Object.assign({},a.settings.shots,{[t.dataset.sh]:v})});return}
  if(t.dataset.adj){const[k,f]=t.dataset.adj.split("|"),v=t.value;
    mutate(a=>{a.adj=a.adj||{};const j=a.adj[k]=a.adj[k]||{};if(v===""||v==="auto")delete j[f];else j[f]=f==="phase"?v:+v;if(!Object.keys(j).length)delete a.adj[k]});
    const w=plan(view(cur())).W.find(x=>iso(x.start)===k);if(w&&w.block!==st.sel){st.sel=w.block;render()}return}
  if(t.dataset.sp){const[p,k]=t.dataset.sp.split("."),v=clamp(parseFloat(t.value)||0,0,100);
    mutate(a=>{a.settings=a.settings||{};const sp=a.settings.split=a.settings.split||{};sp[p]=Object.assign({},DEF.split[p],sp[p]||{});sp[p][k]=v});syncEvForm()}
